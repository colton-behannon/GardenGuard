[project]
name = "gardenguard"
version = "0.1.0"
description = "Automated squirrel detection and water deterrent system for raised garden beds"
requires-python = ">=3.11"
dependencies = [
    # picamera2 and opencv are installed via apt on the Pi (not pip) — see scripts/pi_setup.sh
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
gardenguard = "gardenguard.main:main"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
